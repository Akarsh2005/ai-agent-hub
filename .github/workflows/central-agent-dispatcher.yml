name: Central AI Agent Dispatcher

on:
  repository_dispatch:
    types: [jira_ai_task]

jobs:
  dispatch-agent:
    runs-on: ubuntu-latest

    steps:
      - name: Inspect Incoming Task
        env:
          P_REPO: ${{ github.event.client_payload.target_repo }}
          P_KEY: ${{ github.event.client_payload.jira_key }}
          P_SUMMARY: ${{ github.event.client_payload.summary }}
          P_AGENT: ${{ github.event.client_payload.agent }}
        run: |
          echo "Target Repo: $P_REPO"
          echo "Jira Key:    $P_KEY"
          echo "Summary:     $P_SUMMARY"
          echo "Agent:       $P_AGENT"

      - name: Normalize Target Repository
        id: repo_prep
        env:
          RAW_REPO: ${{ github.event.client_payload.target_url || github.event.client_payload.target_repo }}
          RAW_DESC: ${{ github.event.client_payload.description }}
          JIRA_LABELS: ${{ toJson(github.event.client_payload.labels || '') }}
        run: |
          INPUT_REPO="$RAW_REPO"

          # 1. Check if any Jira label contains a full github.com URL:
          LABEL_URL=$(echo "$JIRA_LABELS" | grep -oE 'https://github.com/[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+' | head -n 1 || echo "")
          if [ -n "$LABEL_URL" ]; then
            INPUT_REPO="$LABEL_URL"
          fi

          # 2. Check if any Jira label has repo: prefix:
          LABEL_REPO=$(echo "$JIRA_LABELS" | grep -oE 'repo:[A-Za-z0-9_./-]+' | head -n 1 | sed 's/repo://' || echo "")
          if [ -z "$INPUT_REPO" ] && [ -n "$LABEL_REPO" ]; then
            INPUT_REPO="$LABEL_REPO"
          fi

          # 3. Check if Jira description contains a github.com URL:
          if [ -z "$INPUT_REPO" ]; then
            INPUT_REPO=$(echo "$RAW_DESC" | grep -oE 'https://github.com/[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+' | head -n 1 || echo "")
          fi

          # Clean full URL down to owner/repo (e.g. https://github.com/Akarsh2005/demo1 -> Akarsh2005/demo1)
          CLEAN_REPO=$(echo "$INPUT_REPO" | sed -E 's|https?://github.com/||; s|\.git$||' | tr -d ' "')

          # If only repo name was given without owner (e.g. 'demo1'), default owner to Akarsh2005
          if [[ "$CLEAN_REPO" != *"/"* ]] && [ -n "$CLEAN_REPO" ]; then
            CLEAN_REPO="Akarsh2005/$CLEAN_REPO"
          fi

          # Fallback default if nothing was matched
          FINAL_REPO="${CLEAN_REPO:-Akarsh2005/demo1}"

          echo "Target normalized repo: $FINAL_REPO"
          echo "target_repo=$FINAL_REPO" >> $GITHUB_OUTPUT

      - name: Checkout Target Repository
        uses: actions/checkout@v4
        with:
          repository: ${{ steps.repo_prep.outputs.target_repo }}
          token: ${{ secrets.CENTRAL_HUB_PAT }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Prepare Git Branch
        id: branch_info
        env:
          JIRA_KEY: ${{ github.event.client_payload.jira_key }}
          SUMMARY: ${{ github.event.client_payload.summary }}
        run: |
          SAFE_KEY="${JIRA_KEY:-TASK}"
          SLUG=$(echo "$SUMMARY" | tr '[:upper:]' '[:lower:]' | tr -cs 'a-z0-9' '-' | sed 's/^-//;s/-$//' | cut -c1-30)
          BRANCH_NAME="feature/${SAFE_KEY}-${SLUG}"

          git config user.name "central-ai-agent[bot]"
          git config user.email "ai-agent@users.noreply.github.com"
          git checkout -b "$BRANCH_NAME"

          echo "branch_name=$BRANCH_NAME" >> $GITHUB_OUTPUT
          echo "jira_key=$SAFE_KEY" >> $GITHUB_OUTPUT

      # ------------------------------------------------------------------
      # OPTION 1: GEMINI AGENT
      # ------------------------------------------------------------------
      - name: Run Gemini Agent
        if: contains(github.event.client_payload.labels, 'gemini-agent') || github.event.client_payload.agent == 'gemini' || (!contains(github.event.client_payload.labels, 'claude-agent') && github.event.client_payload.agent != 'claude')
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TASK_TITLE: ${{ github.event.client_payload.summary }}
          TASK_DESC: ${{ github.event.client_payload.description }}
        run: |
          npm install @google/genai

          cat << 'EOF' > run_gemini.mjs
          import { GoogleGenAI } from '@google/genai';
          import fs from 'fs';
          import path from 'path';

          const ai = new GoogleGenAI({});

          async function run() {
            const task = (process.env.TASK_TITLE || "") + "\n\n" + (process.env.TASK_DESC || "");
            const prompt = `You are an automated software engineer. Implement the feature described in this task:
            ${task}

            Return your response ONLY as a JSON array of files to create or modify:
            [
              {
                "path": "relative/path/to/file.ext",
                "content": "full updated or new content of the file"
              }
            ]
            Do not include markdown ticks around JSON. Output pure valid JSON.`;

            const response = await ai.models.generateContent({
              model: process.env.GEMINI_MODEL || 'gemini-3.1-pro-preview',
              contents: prompt,
            });

            const text = response.text.trim().replace(/^```json/, '').replace(/```$/, '').trim();
            const files = JSON.parse(text);

            for (const file of files) {
              const dir = path.dirname(file.path);
              if (!fs.existsSync(dir)) fs.mkdirSync(dir, { recursive: true });
              fs.writeFileSync(file.path, file.content, 'utf8');
              console.log(`Updated/Created: ${file.path}`);
            }
          }

          run().catch(err => {
            console.error(err);
            process.exit(1);
          });
          EOF

          node run_gemini.mjs
          rm run_gemini.mjs

      # ------------------------------------------------------------------
      # OPTION 2: CLAUDE CODE (via AWS Bedrock OR Anthropic API)
      # ------------------------------------------------------------------
      - name: Run Claude Code Agent
        if: contains(github.event.client_payload.labels, 'claude-agent') || contains(github.event.client_payload.labels, 'bedrock-agent') || github.event.client_payload.agent == 'claude' || github.event.client_payload.agent == 'bedrock'
        timeout-minutes: 15
        env:
          # AWS Bedrock Configuration (Claude runs only through Bedrock)
          CLAUDE_CODE_USE_BEDROCK: '1'
          AWS_REGION: ${{ secrets.AWS_REGION || 'us-east-1' }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}

          TASK_TITLE: ${{ github.event.client_payload.summary }}
          TASK_DESC: ${{ github.event.client_payload.description }}
        run: |
          npm install -g @anthropic-ai/claude-code
          PROMPT="Implement task: ${TASK_TITLE}
          Details:
          ${TASK_DESC}
          Rules:
          - Modify files to meet acceptance criteria.
          - Exit cleanly when done."

          claude -p "$PROMPT" --dangerously-skip-permissions

      # ------------------------------------------------------------------
      # COMMIT, PUSH AND CREATE DRAFT PR ON TARGET REPO
      # ------------------------------------------------------------------
      - name: Commit, Push and Open PR
        env:
          GH_TOKEN: ${{ secrets.CENTRAL_HUB_PAT }}
          TARGET_REPO: ${{ steps.repo_prep.outputs.target_repo }}
          JIRA_KEY: ${{ steps.branch_info.outputs.jira_key }}
          SUMMARY: ${{ github.event.client_payload.summary }}
          BRANCH_NAME: ${{ steps.branch_info.outputs.branch_name }}
          AGENT: ${{ github.event.client_payload.agent || 'gemini' }}
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git add -A
            git commit -m "[$JIRA_KEY] $SUMMARY"
            git push origin "$BRANCH_NAME"

            gh pr create \
              --repo "$TARGET_REPO" \
              --draft \
              --title "[$JIRA_KEY] $SUMMARY" \
              --body "Automated PR generated by **$AGENT** agent via Central AI Hub.
              
              Jira Ticket: **$JIRA_KEY**" \
              --head "$BRANCH_NAME"
          else
            echo "No file changes produced by agent."
          fi
