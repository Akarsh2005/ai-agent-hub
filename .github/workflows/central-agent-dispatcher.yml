name: Central AI Agent Dispatcher

on:
  repository_dispatch:
    types: [jira_ai_task]

jobs:
  dispatch-agent:
    runs-on: ubuntu-latest
    env:
      JIRA_BASE_URL: ${{ secrets.JIRA_BASE_URL }}
      JIRA_USER_EMAIL: ${{ secrets.JIRA_USER_EMAIL }}
      JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
      JIRA_ISSUE_KEY: ${{ github.event.client_payload.jira_key }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

    steps:
      # Helper that moves the Jira ticket to a status (looked up by name) and optionally comments.
      # Written to RUNNER_TEMP because the checkout step below replaces the workspace.
      # Never fails the job: a Jira hiccup must not hide the real result.
      - name: Prepare Jira Helper
        run: |
          cat << 'EOF' > "$RUNNER_TEMP/jira.sh"
          #!/usr/bin/env bash
          # Usage: jira.sh "<target status name>" ["<comment>"]
          STATUS="$1"; COMMENT="$2"
          if [ -z "$JIRA_BASE_URL" ] || [ -z "$JIRA_API_TOKEN" ] || [ -z "$JIRA_ISSUE_KEY" ]; then
            echo "Jira not configured or no issue key; skipping."; exit 0
          fi
          AUTH="$JIRA_USER_EMAIL:$JIRA_API_TOKEN"
          API="$JIRA_BASE_URL/rest/api/3/issue/$JIRA_ISSUE_KEY"
          ID=""
          if [ -n "$STATUS" ]; then
            ID=$(curl -sS -u "$AUTH" -H "Accept: application/json" "$API/transitions" \
              | jq -r --arg s "$STATUS" '.transitions[]? | select(.to.name == $s) | .id' | head -n 1)
          fi
          if [ -z "$STATUS" ]; then
            :
          elif [ -z "$ID" ]; then
            echo "No transition to '$STATUS' available for $JIRA_ISSUE_KEY."
          else
            CODE=$(curl -sS -o /dev/null -w '%{http_code}' -u "$AUTH" -H "Content-Type: application/json" \
              -X POST "$API/transitions" -d "{\"transition\":{\"id\":\"$ID\"}}")
            echo "Jira $JIRA_ISSUE_KEY -> $STATUS: HTTP $CODE"
          fi
          if [ -n "$COMMENT" ]; then
            BODY=$(jq -n --arg t "$COMMENT" '{body:{type:"doc",version:1,content:[{type:"paragraph",content:[{type:"text",text:$t}]}]}}')
            curl -sS -o /dev/null -w 'Jira comment: HTTP %{http_code}\n' -u "$AUTH" -H "Content-Type: application/json" \
              -X POST "$API/comment" -d "$BODY"
          fi
          exit 0
          EOF
          chmod +x "$RUNNER_TEMP/jira.sh"

      - name: Inspect Incoming Task
        env:
          P_REPO: ${{ github.event.client_payload.target_repo }}
          P_KEY: ${{ github.event.client_payload.jira_key }}
          P_SUMMARY: ${{ github.event.client_payload.summary }}
          P_AGENT: ${{ github.event.client_payload.agent }}
        run: |
          echo "Target Repo: $P_REPO"
          echo "Jira Key:    $P_KEY"
          echo "Summary:     $P_SUMMARY"
          echo "Agent:       $P_AGENT"

      # Single source of truth for which agent runs (labels win over the payload field).
      #   bedrock-agent / claude-agent -> bedrock (Claude via AWS Bedrock)
      #   gemini-agent                 -> gemini
      #   nothing recognised           -> gemini (default)
      - name: Select Agent
        id: agent
        env:
          JIRA_LABELS: ${{ toJson(github.event.client_payload.labels || '') }}
        run: |
          # Gemini is disabled for now: every task runs on Claude via AWS Bedrock.
          if echo "$JIRA_LABELS" | grep -qi 'gemini-agent'; then
            echo "::warning::gemini-agent label found, but Gemini is disabled. Running Bedrock instead."
          fi
          echo "Selected agent: bedrock"
          echo "agent=bedrock" >> "$GITHUB_OUTPUT"

      - name: Jira - Set In Progress
        run: '"$RUNNER_TEMP/jira.sh" "In Progress" "AI agent started working on this ticket. Run: $RUN_URL"'

      - name: Normalize Target Repository
        id: repo_prep
        env:
          RAW_REPO: ${{ github.event.client_payload.target_url || github.event.client_payload.target_repo }}
          RAW_DESC: ${{ github.event.client_payload.description }}
          JIRA_LABELS: ${{ toJson(github.event.client_payload.labels || '') }}
        run: |
          INPUT_REPO="$RAW_REPO"

          # 1. Check if any Jira label contains a full github.com URL:
          LABEL_URL=$(echo "$JIRA_LABELS" | grep -oE 'https://github.com/[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+' | head -n 1 || echo "")
          if [ -n "$LABEL_URL" ]; then
            INPUT_REPO="$LABEL_URL"
          fi

          # 2. Check if any Jira label has repo: prefix:
          LABEL_REPO=$(echo "$JIRA_LABELS" | grep -oE 'repo:[A-Za-z0-9_./-]+' | head -n 1 | sed 's/repo://' || echo "")
          if [ -z "$INPUT_REPO" ] && [ -n "$LABEL_REPO" ]; then
            INPUT_REPO="$LABEL_REPO"
          fi

          # 3. Check if Jira description contains a github.com URL:
          if [ -z "$INPUT_REPO" ]; then
            INPUT_REPO=$(echo "$RAW_DESC" | grep -oE 'https://github.com/[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+' | head -n 1 || echo "")
          fi

          # Clean full URL down to owner/repo (e.g. https://github.com/Akarsh2005/demo1 -> Akarsh2005/demo1)
          CLEAN_REPO=$(echo "$INPUT_REPO" | sed -E 's|https?://github.com/||; s|\.git$||' | tr -d ' "')

          # If only repo name was given without owner (e.g. 'demo1'), default owner to Akarsh2005
          if [[ "$CLEAN_REPO" != *"/"* ]] && [ -n "$CLEAN_REPO" ]; then
            CLEAN_REPO="Akarsh2005/$CLEAN_REPO"
          fi

          # Fallback default if nothing was matched
          FINAL_REPO="${CLEAN_REPO:-Akarsh2005/demo1}"

          echo "Target normalized repo: $FINAL_REPO"
          echo "target_repo=$FINAL_REPO" >> $GITHUB_OUTPUT

      - name: Checkout Target Repository
        uses: actions/checkout@v4
        with:
          repository: ${{ steps.repo_prep.outputs.target_repo }}
          token: ${{ secrets.CENTRAL_HUB_PAT }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Prepare Git Branch
        id: branch_info
        env:
          JIRA_KEY: ${{ github.event.client_payload.jira_key }}
          SUMMARY: ${{ github.event.client_payload.summary }}
        run: |
          SAFE_KEY="${JIRA_KEY:-TASK}"
          SLUG=$(echo "$SUMMARY" | tr '[:upper:]' '[:lower:]' | tr -cs 'a-z0-9' '-' | sed 's/^-//' | cut -c1-30 | sed 's/-$//')
          # Run number keeps the name unique so retries never collide with an old branch.
          BRANCH_NAME="feature/${SAFE_KEY}-${SLUG}-r${GITHUB_RUN_NUMBER}"

          git config user.name "central-ai-agent[bot]"
          git config user.email "ai-agent@users.noreply.github.com"
          git checkout -b "$BRANCH_NAME"

          echo "branch_name=$BRANCH_NAME" >> $GITHUB_OUTPUT
          echo "jira_key=$SAFE_KEY" >> $GITHUB_OUTPUT

      # ------------------------------------------------------------------
      # OPTION 1: GEMINI AGENT
      # GEMINI AGENT IS DISABLED FOR NOW (Bedrock-only testing). To re-enable: uncomment the step below
      # and restore the gemini branch in the "Select Agent" step.
      # ------------------------------------------------------------------
      # - name: Run Gemini Agent
      #   if: steps.agent.outputs.agent == 'gemini'
      #   env:
      #     GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      #     GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
      #     TASK_TITLE: ${{ github.event.client_payload.summary }}
      #     TASK_DESC: ${{ github.event.client_payload.description }}
      #   run: |
      #     # Install the SDK and keep the script OUTSIDE the target repo workspace, so node_modules,
      #     # package.json and package-lock.json are never committed to the target repo.
      #     GEMINI_DIR="$RUNNER_TEMP/gemini-agent"
      #     mkdir -p "$GEMINI_DIR"
      #     (cd "$GEMINI_DIR" && npm init -y >/dev/null && npm install @google/genai)
      #
      #     cat << 'EOF' > "$GEMINI_DIR/run_gemini.mjs"
      #     import { GoogleGenAI } from '@google/genai';
      #     import fs from 'fs';
      #     import path from 'path';
      #
      #     const ai = new GoogleGenAI({});
      #
      #     async function run() {
      #       const task = (process.env.TASK_TITLE || "") + "\n\n" + (process.env.TASK_DESC || "");
      #       const prompt = `You are an automated software engineer. Implement the feature described in this task:
      #       ${task}
      #
      #       Return your response ONLY as a JSON array of files to create or modify:
      #       [
      #         {
      #           "path": "relative/path/to/file.ext",
      #           "content": "full updated or new content of the file"
      #         }
      #       ]
      #       Do not include markdown ticks around JSON. Output pure valid JSON.`;
      #
      #       // Try the configured model first, then fall back if it is retired (404) or out of quota (429).
      #       const models = [process.env.GEMINI_MODEL, 'gemini-3-flash-preview', 'gemini-2.5-flash', 'gemini-3.1-pro-preview'].filter(Boolean);
      #       let response;
      #       for (const model of models) {
      #         try {
      #           console.log(`Trying model: ${model}`);
      #           response = await ai.models.generateContent({ model, contents: prompt });
      #           break;
      #         } catch (err) {
      #           if (![404, 429].includes(err.status)) throw err;
      #           console.warn(`Model ${model} unavailable (${err.status}), trying next...`);
      #         }
      #       }
      #       if (!response) throw new Error('No Gemini model was available for this API key.');
      #
      #       const text = response.text.trim().replace(/^```json/, '').replace(/```$/, '').trim();
      #       const files = JSON.parse(text);
      #
      #       const root = process.cwd();
      #       for (const file of files) {
      #         // Only write inside the repo checkout (reject absolute paths and ../ escapes).
      #         const target = path.resolve(root, file.path);
      #         if (!target.startsWith(root + path.sep)) {
      #           console.warn(`Skipping path outside repo: ${file.path}`);
      #           continue;
      #         }
      #         fs.mkdirSync(path.dirname(target), { recursive: true });
      #         fs.writeFileSync(target, file.content, 'utf8');
      #         console.log(`Updated/Created: ${file.path}`);
      #       }
