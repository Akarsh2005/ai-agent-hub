      #
      #     run().catch(err => {
      #       console.error(err);
      #       process.exit(1);
      #     });
      #     EOF
      #
      #     # Run from the repo checkout (cwd) so files are written there; imports resolve from the script's own folder.
      #     node "$GEMINI_DIR/run_gemini.mjs"

      # ------------------------------------------------------------------
      # CLAUDE CODE (via AWS Bedrock ONLY - no direct Anthropic API)
      # ------------------------------------------------------------------
      - name: Run Claude Code Agent
        if: steps.agent.outputs.agent == 'bedrock'
        timeout-minutes: 15
        env:
          # AWS Bedrock Configuration (Claude runs only through Bedrock)
          CLAUDE_CODE_USE_BEDROCK: '1'
          AWS_REGION: ${{ secrets.AWS_REGION || 'us-east-1' }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
          # Optional repo variable (Settings > Variables) to override the default Haiku profile.
          BEDROCK_MODEL: ${{ vars.BEDROCK_MODEL }}

          TASK_TITLE: ${{ github.event.client_payload.summary }}
          TASK_DESC: ${{ github.event.client_payload.description }}
        run: |
          if [ -z "$AWS_ACCESS_KEY_ID" ] || [ -z "$AWS_SECRET_ACCESS_KEY" ]; then
            echo "::error::AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY secrets are missing."
            exit 1
          fi
          # Bedrock only: make sure no direct Anthropic API credential can be picked up.
          unset ANTHROPIC_API_KEY ANTHROPIC_AUTH_TOKEN
          [ "$CLAUDE_CODE_USE_BEDROCK" = "1" ] || { echo "::error::Bedrock mode is not enabled."; exit 1; }

          # An empty session token breaks some AWS SDKs; only keep it for temporary (ASIA...) credentials.
          [ -z "$AWS_SESSION_TOKEN" ] && unset AWS_SESSION_TOKEN

          # Claude Haiku 4.5 via a cross-region inference profile. Prefix must match the region.
          case "$AWS_REGION" in
            eu-*) PREFIX=eu ;;
            ap-*) PREFIX=apac ;;
            *)    PREFIX=us ;;
          esac
          export ANTHROPIC_MODEL="${BEDROCK_MODEL:-$PREFIX.anthropic.claude-haiku-4-5-20251001-v1:0}"
          export ANTHROPIC_SMALL_FAST_MODEL="$ANTHROPIC_MODEL"
          echo "Bedrock region: $AWS_REGION"
          echo "Bedrock model:  $ANTHROPIC_MODEL"

          npm install -g @anthropic-ai/claude-code

          PROMPT="You are an automated software engineer working inside a git checkout of the target repository.
          Task: ${TASK_TITLE}

          Details:
          ${TASK_DESC}

          Rules:
          - First look at the existing project structure and follow its conventions (module style, naming).
          - Implement exactly what the task asks. Create the files named in the task; do not modify unrelated files.
          - Do not run git commands that change history, do not commit, do not push.
          - Do not create extra files such as notes, summaries or READMEs unless the task asks for them.
          - When all requested files are written, stop."

          # File tools + read-only git only. No arbitrary shell, so ticket text cannot make the agent run commands.
          claude -p "$PROMPT" \
            --permission-mode acceptEdits \
            --allowedTools "Read,Write,Edit,MultiEdit,Glob,Grep,LS,Bash(git status:*),Bash(git diff:*),Bash(git log:*),Bash(ls:*),Bash(cat:*)" \
            --max-turns 30

      # ------------------------------------------------------------------
      # COMMIT, PUSH AND CREATE DRAFT PR ON TARGET REPO
      # ------------------------------------------------------------------
      - name: Commit, Push and Open PR
        id: pr
        env:
          GH_TOKEN: ${{ secrets.CENTRAL_HUB_PAT }}
          TARGET_REPO: ${{ steps.repo_prep.outputs.target_repo }}
          JIRA_KEY: ${{ steps.branch_info.outputs.jira_key }}
          SUMMARY: ${{ github.event.client_payload.summary }}
          BRANCH_NAME: ${{ steps.branch_info.outputs.branch_name }}
          AGENT: ${{ steps.agent.outputs.agent == 'bedrock' && 'claude (AWS Bedrock)' || 'gemini' }}
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "No file changes produced by agent; failing so the Jira ticket is flagged."
            exit 1
          fi

          git add -A
          git commit -m "[$JIRA_KEY] $SUMMARY"
          git push origin "$BRANCH_NAME"

          PR_URL=$(gh pr create \
            --repo "$TARGET_REPO" \
            --title "[$JIRA_KEY] $SUMMARY" \
            --body "Automated PR generated by **$AGENT** agent via Central AI Hub.

          Jira Ticket: **$JIRA_KEY**" \
            --head "$BRANCH_NAME")

          echo "PR created: $PR_URL"
          echo "pr_url=$PR_URL" >> "$GITHUB_OUTPUT"

      # ------------------------------------------------------------------
      # REQUEST REVIEWERS (from Jira labels like reviewer:github-username)
      # Non-fatal: a bad username must not fail the run or the Jira transition.
      # ------------------------------------------------------------------
      - name: Request PR Reviewers
        if: success()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.CENTRAL_HUB_PAT }}
          TARGET_REPO: ${{ steps.repo_prep.outputs.target_repo }}
          PR_URL: ${{ steps.pr.outputs.pr_url }}
          JIRA_LABELS: ${{ toJson(github.event.client_payload.labels || '') }}
        run: |
          OWNER="${TARGET_REPO%%/*}"
          REVIEWERS=$(echo "$JIRA_LABELS" | grep -oiE 'reviewer:[A-Za-z0-9-]+' | sed -E 's/^reviewer://I' | sort -u | grep -vix "$OWNER" || true)

          if [ -z "$REVIEWERS" ]; then
            echo "No reviewer:<username> labels found; skipping."
            exit 0
          fi

          ADDED=""
          for R in $REVIEWERS; do
            PR_NUM="${PR_URL##*/}"
            # REST API returns the resulting reviewer list, so we can verify instead of trusting the exit code.
            RESP=$(gh api -X POST "repos/$TARGET_REPO/pulls/$PR_NUM/requested_reviewers" -f "reviewers[]=$R" 2>&1) || true
            if echo "$RESP" | jq -e --arg r "$R" '[.requested_reviewers[]?.login | ascii_downcase] | index($r | ascii_downcase)' >/dev/null 2>&1; then
              echo "Requested review from: $R (confirmed on PR)"
              ADDED="${ADDED:+$ADDED, }$R"
            else
              echo "::warning::Review NOT registered for '$R'. GitHub response: $(echo "$RESP" | head -c 400)"
              echo "Check: exact username, and that they ACCEPTED the collaborator invite on $TARGET_REPO."
            fi
          done

          if [ -n "$ADDED" ] && [ -f "$RUNNER_TEMP/jira.sh" ]; then
            "$RUNNER_TEMP/jira.sh" "" "Review requested from: $ADDED" || true
          fi

      # ------------------------------------------------------------------
      # JIRA STATUS UPDATES (outcome of the run)
      # ------------------------------------------------------------------
      - name: Jira - Set Ready for Review
        if: success()
        env:
          PR_URL: ${{ steps.pr.outputs.pr_url }}
        run: '"$RUNNER_TEMP/jira.sh" "Ready for Review" "Pull request created by the AI agent: $PR_URL"'

      - name: Jira - Set Error
        if: failure()
        run: |
          if [ -f "$RUNNER_TEMP/jira.sh" ]; then
            "$RUNNER_TEMP/jira.sh" "Error occurred during development" "AI agent run failed. See logs: $RUN_URL"
          fi
